name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Typecheck — verify the full TypeScript solution compiles cleanly
  # ──────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (libs + artifacts)
        run: pnpm run typecheck

  # ──────────────────────────────────────────────────────────────────────────
  # Build — verify production builds succeed
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/elysium_test
      SESSION_SECRET: ci-test-secret-value-at-least-32-characters-long
      NODE_ENV: production
      PORT: 5000
      BASE_PATH: /

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: pnpm --filter @workspace/elysium-web run build

  # ──────────────────────────────────────────────────────────────────────────
  # Codegen check — ensure generated files are up to date with the spec
  # ──────────────────────────────────────────────────────────────────────────
  codegen-check:
    name: Codegen Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run codegen
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Check for uncommitted changes
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files are out of sync with openapi.yaml."
            echo "Run 'pnpm --filter @workspace/api-spec run codegen' locally and commit the result."
            git diff --stat
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Lint — optional but enforced on PRs
  # ──────────────────────────────────────────────────────────────────────────
  lint:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm prettier --check "**/*.{ts,tsx,json,yaml,md}" --ignore-path .prettierignore
