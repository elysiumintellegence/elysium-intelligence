name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy notification
        run: |
          echo "Deployment triggered from commit ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo ""
          echo "Replit auto-deploys from main. This workflow tracks deployment status."
          echo "Visit: https://replit.com/@elysiumintellegence/elysium-intelligence"
