kind = "web"
previewPath = "/"
title = "Elysium Intelligence"
version = "1.0.0"
id = "artifacts/elysium-web"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24742

[services.development]
run = "pnpm --filter @workspace/elysium-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elysium-web", "run", "build" ]
serve = "static"
publicDir = "artifacts/elysium-web/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24742"
BASE_PATH = "/"
